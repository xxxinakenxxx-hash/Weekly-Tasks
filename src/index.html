<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('css'); ?>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title"><?= ctx.appTitle ?></h1>
    <nav class="tabs" role="tablist">
      <? for (var i = 0; i < ctx.views.length; i++) { var v = ctx.views[i]; ?>
        <button type="button" class="tab" role="tab" data-view="<?= v.key ?>"><?= v.label ?></button>
      <? } ?>
    </nav>
  </header>

  <div id="error-box" class="error-box" role="alert" hidden>
    <span id="error-message"></span>
    <button type="button" id="error-close" class="error-close" aria-label="閉じる">×</button>
  </div>

  <main>
    <section id="view-weekly" class="view" data-view="weekly" hidden>
      <?!= include('view_weekly'); ?>
    </section>
    <section id="view-brief" class="view" data-view="brief" hidden>
      <?!= include('view_brief'); ?>
    </section>
  </main>

  <script>
    var APP_CTX = <?!= JSON.stringify(ctx) ?>;
  </script>
  <?!= include('js'); ?>
  <?!= include('weekly'); ?>
</body>
</html>
