<script>
  // 朝ブリーフ画面（IS-03）：ChatGPT Project の朝ブリーフ（docs/BRIEF_FORMAT.md）を読み込み・保存・表示する
  (function () {
    var SECTIONS = [
      ['今日の流れ', 'flow'], ['今日優先すること', 'priorities'], ['気にかけておきたいこと', 'concerns'],
      ['もう片づいていること', 'done'], ['未完了・持越し', 'carryover']
    ];
    var state = { date: APP_CTX.today, today: APP_CTX.today, preview: null, shown: null };
    var EXCEPTIONS = ['要確認', '不一致', 'チャット未確認', '取得失敗'];
    // 「区分：内容」で始まる行は区分を目印で表示する（IS-05）
    function itemNode(text) {
      var li = document.createElement('li');
      var m = EXCEPTIONS.filter(function (e) { return String(text).indexOf(e + '：') === 0; })[0];
      if (m) {
        var tag = document.createElement('span'); tag.className = 'wk-exc-tag'; tag.textContent = m;
        li.className = 'br-exc';
        li.appendChild(tag);
        li.appendChild(document.createTextNode(String(text).slice(m.length + 1)));
      } else {
        li.textContent = text;
      }
      return li;
    }

    function $(id) { return document.getElementById(id); }
    function addDays(ymd, n) {
      var p = ymd.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
      return d.toISOString().slice(0, 10);
    }
    function weekday(ymd) {
      var p = ymd.split('-').map(Number);
      return '日月火水木金土'.charAt(new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay());
    }

    function parseBrief(text) {
      var data;
      try { data = JSON.parse(String(text).trim()); } catch (e) { throw new Error('JSONとして読めません：' + e.message); }
      if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('JSONの一番外側は { } にしてください。');
      var errors = [];
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(data['日付'] || ''))) errors.push('「日付」は yyyy-MM-dd で指定してください。');
      if (typeof data['今日の一言'] !== 'string' || !data['今日の一言'].trim()) errors.push('「今日の一言」は必須の文字列です。');
      var out = { date: data['日付'], oneLine: data['今日の一言'] };
      SECTIONS.forEach(function (s) {
        var v = data[s[0]];
        if (!Array.isArray(v) || v.some(function (x) { return typeof x !== 'string'; })) errors.push('「' + s[0] + '」は文字列の配列で指定してください。');
        out[s[1]] = v || [];
      });
      if (errors.length) throw new Error(errors.join(' '));
      return out;
    }

    // 「気にかけておきたいこと」のうち、朝いちばんに見せる重要な注意（取得失敗・不一致・期限）。
    // 要確認・チャット未確認・その他は「ほかの注意・要確認」に折りたたむ（表示の並べ替えのみ。内容は変えない）
    function isImportant(text) {
      var s = String(text);
      return s.indexOf('取得失敗：') === 0 || s.indexOf('不一致：') === 0 || s.indexOf('期限') === 0;
    }
    function fillList(id, items) {
      var ul = $(id); ul.innerHTML = '';
      if (!items.length) {
        var none = document.createElement('li'); none.className = 'wk-muted'; none.textContent = 'なし'; ul.appendChild(none);
      }
      items.forEach(function (x) { ul.appendChild(itemNode(x)); });
    }

    function render(brief, isPreview) {
      $('br-date').textContent = state.date + '（' + weekday(state.date) + '）' + (state.date === state.today ? ' 今日' : '');
      $('br-loading').hidden = true;
      $('br-empty').hidden = !!brief;
      $('br-body').hidden = !brief;
      $('br-body-more').hidden = !brief;
      $('br-preview-note').hidden = !isPreview;
      $('br-save-bar').hidden = !isPreview;
      if (!brief) return;
      $('br-oneLine').textContent = brief.oneLine;
      fillList('br-flow', brief.flow);
      fillList('br-priorities', brief.priorities);
      var important = brief.concerns.filter(isImportant);
      var others = brief.concerns.filter(function (x) { return !isImportant(x); });
      fillList('br-concerns', important);
      fillList('br-concerns-more', others);
      $('br-concerns-more-wrap').hidden = !others.length;
      $('br-concerns-more-title').textContent = 'ほかの注意・要確認（' + others.length + '件）';
      fillList('br-carryover', brief.carryover);
      $('br-carryover-title').textContent = '未完了・持越し（' + brief.carryover.length + '件）';
      fillList('br-done', brief.done);
      $('br-done-title').textContent = 'もう片づいていること（' + brief.done.length + '件）';
      $('br-saved-at').textContent = isPreview ? '' : '保存日時：' + brief.savedAt;
    }

    function load(date) {
      state.preview = null;
      $('br-loading').hidden = false;
      $('br-saved').hidden = true;
      App.callServer('getMorningBrief', [date], function (res) {
        state.date = res.date; state.today = res.today; state.shown = res.date;
        $('br-stale').hidden = true;
        render(res.brief, false);
        loadTasks();
      }, function () {
        // 取得失敗時、別の日の朝ブリーフを表示し続けない（IS-05）
        $('br-loading').hidden = true;
        var st = $('br-stale');
        st.hidden = false;
        if (state.shown === date) {
          var at = $('br-saved-at').textContent;
          st.textContent = '最新の読み込みに失敗しました。表示中は前回読み込んだ内容です' + (at ? '（' + at + '）' : '') + '。';
        } else {
          state.date = date; state.shown = null;
          $('br-date').textContent = date + '（' + weekday(date) + '）' + (date === state.today ? ' 今日' : '');
          $('br-body').hidden = true; $('br-body-more').hidden = true; $('br-empty').hidden = true;
          tasksState.tasks = []; tasksState.loadedAt = '';
          $('br-tasks-panel').hidden = true;
          st.textContent = 'この日の朝ブリーフを読み込めませんでした。「今日」または日付の移動ボタンを押して取り直してください。';
        }
      });
    }
    function move(n) {
      if (state.preview && !window.confirm('保存していない朝ブリーフがあります。破棄して移動しますか？')) return;
      load(n === null ? state.today : addDays(state.date, n));
    }

    $('br-prev').addEventListener('click', function () { move(-1); });
    $('br-next').addEventListener('click', function () { move(1); });
    $('br-today').addEventListener('click', function () { move(null); });
    $('br-import-load').addEventListener('click', function () {
      try {
        var b = parseBrief($('br-import-input').value);
        state.preview = b; state.date = b.date;
        $('br-import').open = false;
        $('br-saved').hidden = true;
        render(b, true);
        App.clearError();
      } catch (e) { App.showError(e.message); }
    });
    $('br-save').addEventListener('click', function () {
      if (!state.preview) return;
      $('br-save').disabled = true;
      App.callServer('saveMorningBrief', [state.preview], function (res) {
        state.preview = null; state.date = res.date; state.shown = res.date;
        $('br-stale').hidden = true;
        $('br-save').disabled = false;
        render(res.brief, false);
        $('br-saved').textContent = '保存しました。';
        $('br-saved').hidden = false;
      }, function () { $('br-save').disabled = false; });
    });

    // ---- 今週のタスクの日次更新（IS-04）----
    var STATUS = APP_CTX.statusValues, DAYS = APP_CTX.dayValues;
    var tasksState = { week: null, tasks: [], open: {}, loadedAt: '' };
    function mondayOf(ymd) {
      var p = ymd.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
      d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
      return d.toISOString().slice(0, 10);
    }
    function mk(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    // 1件＝1行（種別・タスク名・状態）。押すとその1件の入力欄だけが開く
    function taskRow(t) {
      var box = mk('details', 'br-task');
      box.setAttribute('data-task-id', t.taskId);
      if (tasksState.open[t.taskId]) box.open = true;
      box.addEventListener('toggle', function () { tasksState.open[t.taskId] = box.open; });
      var sum = mk('summary', 'br-task-line');
      sum.appendChild(mk('span', 'wk-tag ' + (t.kind === 'AI案件' ? 'tag-ai' : 'tag-normal'), t.kind === 'AI案件' ? 'AI' : '通常'));
      sum.appendChild(mk('span', 'br-task-title', t.title));
      // 例外情報がある場合は区分を目印で出す（IS-05）
      EXCEPTIONS.filter(function (e) { return new RegExp('(^|／)' + e + '：').test(String(t.exception || '')); })
        .forEach(function (e) { sum.appendChild(mk('span', 'wk-exc-tag', e)); });
      sum.appendChild(mk('span', 'br-task-status', t.status));
      box.appendChild(sum);

      var body = mk('div', 'br-task-body');
      var row = mk('div', 'wk-fields');
      var status = mk('select'); status.setAttribute('aria-label', '状態');
      STATUS.forEach(function (v) { var o = mk('option', '', v); o.value = v; status.appendChild(o); });
      status.value = t.status;
      var day = mk('select'); day.setAttribute('aria-label', '曜日');
      var o0 = mk('option', '', '未配置'); o0.value = ''; day.appendChild(o0);
      DAYS.forEach(function (v) { var o = mk('option', '', v); o.value = v; day.appendChild(o); });
      day.value = t.day || '';
      [['状態', status], ['曜日', day]].forEach(function (p) {
        var l = mk('label', 'wk-field'); l.appendChild(mk('span', '', p[0])); l.appendChild(p[1]); row.appendChild(l);
      });
      body.appendChild(row);
      var fields = {};
      [['result', '実施結果'], ['memo', 'メモ'], ['handover', '次回申し送り']].forEach(function (f) {
        var l = mk('label', 'wk-record-field'); l.appendChild(mk('span', '', f[1]));
        var ta = mk('textarea'); ta.rows = 2; ta.value = t[f[0]] || ''; ta.setAttribute('aria-label', f[1]);
        l.appendChild(ta); body.appendChild(l); fields[f[0]] = ta;
      });
      var btn = mk('button', 'btn btn-primary btn-small', 'この内容で保存'); btn.type = 'button';
      var msg = mk('span', 'wk-saved br-task-msg');
      btn.addEventListener('click', function () {
        var changes = {};
        if (status.value !== t.status) changes.status = status.value;
        if (day.value !== (t.day || '')) changes.day = day.value;
        Object.keys(fields).forEach(function (k) { if (fields[k].value !== (t[k] || '')) changes[k] = fields[k].value; });
        if (!Object.keys(changes).length) { msg.textContent = '変更はありません'; return; }
        btn.disabled = true;
        App.callServer('commitWeekBoard', [tasksState.week, { updates: [{ taskId: t.taskId, changes: changes }] }], function (res) {
          tasksState.tasks = res.tasks; tasksState.loadedAt = res.loadedAt;
          renderTasks();
          var m = document.querySelector('.br-task[data-task-id="' + t.taskId + '"] .br-task-msg');
          if (m) m.textContent = '保存しました';
        }, function () { btn.disabled = false; });
      });
      if (t.exception) {
        var ex = mk('p', 'wk-exception br-task-exc', '例外情報：' + t.exception);
        body.insertBefore(ex, body.firstChild);
      }
      var foot = mk('div', 'br-task-foot'); foot.appendChild(btn); foot.appendChild(msg);
      body.appendChild(foot);
      box.appendChild(body);
      return box;
    }
    function renderTasks() {
      var wd = weekday(state.date);
      var todayTasks = tasksState.tasks.filter(function (t) { return t.day === wd; });
      var others = tasksState.tasks.filter(function (t) { return t.day !== wd; });
      $('br-tasks-title').textContent = '今週のタスク（' + tasksState.week + ' の週）';
      $('br-tasks-empty').hidden = tasksState.tasks.length > 0;
      $('br-today-title').textContent = wd + '曜日のタスク（' + todayTasks.length + '件）';
      $('br-today-title').hidden = !tasksState.tasks.length;
      $('br-tasks-other-title').textContent = 'その他の今週のタスク（' + others.length + '件）';
      $('br-tasks-other-wrap').hidden = !others.length;
      var a = $('br-tasks-today'), b = $('br-tasks-other');
      a.innerHTML = ''; b.innerHTML = '';
      todayTasks.forEach(function (t) { a.appendChild(taskRow(t)); });
      others.forEach(function (t) { b.appendChild(taskRow(t)); });
      $('br-tasks-loaded-at').textContent = tasksState.loadedAt ? '正データ ' + tasksState.loadedAt + ' 時点' : '';
    }
    function loadTasks() {
      var week = mondayOf(state.date);
      $('br-tasks-panel').hidden = false;
      App.callServer('getWeekBoard', [week], function (res) {
        tasksState.week = res.targetWeek; tasksState.tasks = res.tasks; tasksState.loadedAt = res.loadedAt;
        $('br-tasks-stale').hidden = true;
        renderTasks();
      }, function () {
        var st = $('br-tasks-stale');
        st.hidden = false;
        if (tasksState.week === week && tasksState.loadedAt) {
          st.textContent = '最新の読み込みに失敗しました。表示中は ' + tasksState.loadedAt + ' 時点の前回値です。';
        } else {
          // 別の週のタスクは表示しない
          tasksState.week = week; tasksState.tasks = []; tasksState.loadedAt = '';
          $('br-tasks-today').innerHTML = ''; $('br-tasks-other').innerHTML = '';
          $('br-today-title').hidden = true; $('br-tasks-other-wrap').hidden = true; $('br-tasks-empty').hidden = true;
          $('br-tasks-loaded-at').textContent = '';
          st.textContent = 'この週のタスクを読み込めませんでした。';
        }
      });
    }

    window.Brief = { parse: parseBrief };
    var loaded = false;
    // 朝ブリーフタブを初めて開いたときに読み込む
    function ensureLoaded() { if (!loaded) { loaded = true; load(state.date); } }
    document.addEventListener('viewshown', function (e) {
      if (e.detail !== 'brief') return;
      if (!loaded) { ensureLoaded(); return; }
      loadTasks();
    });
    if (APP_CTX.initialView === 'brief') ensureLoaded();
  })();
</script>
