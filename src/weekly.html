<script>
  // 週間タスク画面（IS-01）：表示・編集・候補の採用/削除・1回確定・再読込
  (function () {
    var STATUS = APP_CTX.statusValues, KINDS = APP_CTX.kindValues, DAYS = APP_CTX.dayValues;
    var EXCEPTIONS = ['要確認', '不一致', 'チャット未確認', '取得失敗'];
    var EDIT_KEYS = ['title', 'day', 'priority', 'focus', 'status', 'result', 'memo', 'handover', 'exception'];
    var RECORD_FIELDS = [['result', '実施結果'], ['memo', 'メモ'], ['handover', '次回申し送り']];
    // 採用前に個別の確認が必要な例外区分（IS-05：自動確定しない）
    var CONFIRM_REQUIRED = ['不一致', 'チャット未確認'];
    var state = { week: APP_CTX.currentWeek, saved: [], edits: {}, candidates: [], analysis: null, seq: 0, openRecords: {}, openHistory: {}, openDetails: {}, dragKey: null, dragFrom: '', loadedAt: '' };

    function $(id) { return document.getElementById(id); }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function addDays(ymd, n) {
      var p = ymd.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
      return d.toISOString().slice(0, 10);
    }

    // ---- 曜日（追加実装 v1.1）：1タスクに複数曜日。保存形式は月→金の固定順を「,」でつないだ文字列。空欄＝未配置 ----
    function daysOf(v) {
      var s = String(v || '');
      return s ? s.split(',') : [];
    }
    function joinDays(arr) {
      return DAYS.filter(function (d) { return arr.indexOf(d) >= 0; }).join(',');
    }
    // 週間タスクJSONの「曜日」：文字列（"木"、"月,火"）または配列（["月","火"]）。月〜金以外はエラー
    function parseDays(v) {
      var parts = Array.isArray(v) ? v : String(v || '').split(/[,、・\s]+/);
      var out = [];
      for (var i = 0; i < parts.length; i++) {
        var p = String(parts[i]).trim();
        if (!p) continue;
        if (DAYS.indexOf(p) < 0) return null;
        if (out.indexOf(p) < 0) out.push(p);
      }
      return joinDays(out);
    }

    // ---- 例外情報（IS-05）：「区分：内容」を「／」区切りで複数持てる ----
    var EXC_SPLIT = new RegExp('／(?=(?:' + EXCEPTIONS.join('|') + ')：)');
    function exceptionParts(text) {
      var s = String(text || '');
      if (!s) return [];
      return s.split(EXC_SPLIT).map(function (p) {
        var i = p.indexOf('：'), type = p.slice(0, i);
        return EXCEPTIONS.indexOf(type) >= 0 ? { type: type, body: p.slice(i + 1) } : { type: '', body: p };
      });
    }
    function exceptionTypes(text) {
      return exceptionParts(text).map(function (p) { return p.type; }).filter(function (t, i, a) { return t && a.indexOf(t) === i; });
    }
    function needsConfirm(c) {
      return exceptionTypes(c.exception).some(function (t) { return CONFIRM_REQUIRED.indexOf(t) >= 0; });
    }
    function validException(text) {
      return !text || EXCEPTIONS.some(function (e) { return String(text).indexOf(e + '：') === 0; });
    }
    function exceptionBox(text) {
      var box = el('div', 'wk-exception');
      exceptionParts(text).forEach(function (p) {
        var line = el('p', 'wk-exc-line');
        line.appendChild(el('span', 'wk-exc-tag', p.type || '例外'));
        line.appendChild(document.createTextNode(p.body));
        box.appendChild(line);
      });
      return box;
    }

    // ---- ChatGPT Project 分析結果（docs/HANDOFF_FORMAT.md）----
    function parseHandoff(text) {
      var data;
      try { data = JSON.parse(String(text).trim()); } catch (e) { throw new Error('JSONとして読めません：' + e.message); }
      var errors = [];
      if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('JSONの一番外側は { } にしてください。');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(data['対象週'] || ''))) errors.push('「対象週」は yyyy-MM-dd で指定してください。');
      if (typeof data['見立て'] !== 'string') errors.push('「見立て」は文字列で指定してください。');
      if (!Array.isArray(data['コーション'])) errors.push('「コーション」は配列で指定してください。');
      if (!Array.isArray(data['タスク案'])) errors.push('「タスク案」は配列で指定してください。');
      (data['タスク案'] || []).forEach(function (t, i) {
        var n = (i + 1) + '件目：';
        if (!t || typeof t !== 'object') { errors.push(n + '形式が不正です。'); return; }
        if (!t['タスク名']) errors.push(n + '「タスク名」は必須です。');
        if (KINDS.indexOf(t['種別']) < 0) errors.push(n + '「種別」は ' + KINDS.join('／') + ' のいずれかです。');
        if (t['曜日'] !== undefined && t['曜日'] !== '' && parseDays(t['曜日']) === null) errors.push(n + '「曜日」は 月〜金（複数可）または空欄です。');
        if (t['優先度'] !== undefined && t['優先度'] !== '' && !(Number(t['優先度']) >= 1 && Number(t['優先度']) % 1 === 0)) errors.push(n + '「優先度」は1以上の整数です。');
        if (t['重点'] !== undefined && typeof t['重点'] !== 'boolean') errors.push(n + '「重点」は true／false です。');
        if (t['例外情報'] && !EXCEPTIONS.some(function (e) { return String(t['例外情報']).indexOf(e + '：') === 0; })) {
          errors.push(n + '「例外情報」は「区分：内容」で、区分は ' + EXCEPTIONS.join('／') + ' です。');
        }
        if (t['AI案件現在地'] !== undefined && t['AI案件現在地'] !== '') {
          if (typeof t['AI案件現在地'] !== 'string') errors.push(n + '「AI案件現在地」は文字列です。');
          else if (t['種別'] !== 'AI案件') errors.push(n + '「AI案件現在地」は種別がAI案件の場合だけ指定できます。');
        }
      });
      if (errors.length) throw new Error(errors.join(' '));
      return data;
    }

    function importAnalysis() {
      var data = parseHandoff($('wk-import-input').value);
      if (data['対象週'] !== state.week) {
        throw new Error('分析結果の対象週（' + data['対象週'] + '）が表示中の週（' + state.week + '）と違います。');
      }
      state.analysis = { outlook: data['見立て'], cautions: data['コーション'] };
      // 対象週の保存済みタスクとタスク名が完全一致する案は候補にしない（類似判定はしない）
      var savedTitles = state.saved.map(function (t) { return String(t.title); });
      var excluded = [];
      var proposals = data['タスク案'].filter(function (t) {
        if (savedTitles.indexOf(String(t['タスク名'])) < 0) return true;
        excluded.push(String(t['タスク名']));
        return false;
      });
      showExcluded(excluded);
      state.candidates = proposals.map(function (t) {
        return {
          key: 'c' + (++state.seq), title: String(t['タスク名']), kind: t['種別'], day: parseDays(t['曜日']) || '',
          priority: t['優先度'] === undefined ? '' : t['優先度'], focus: t['重点'] === true,
          status: '未着手', exception: t['例外情報'] || '', aiPosition: t['AI案件現在地'] || ''
        };
      });
      $('wk-import').open = false;
      render();
    }

    function showExcluded(titles) {
      var p = $('wk-import-excluded');
      p.hidden = !titles.length;
      p.textContent = titles.length ? '既存タスクと同名のため候補から除外：' + titles.length + '件（' + titles.join('、') + '）' : '';
    }

    // ---- 表示用データ ----
    function viewTask(t) {
      var e = state.edits[t.taskId] || {};
      var v = {};
      Object.keys(t).forEach(function (k) { v[k] = e.hasOwnProperty(k) ? e[k] : t[k]; });
      v.key = t.taskId;
      v.isCandidate = false;
      v.changed = Object.keys(e).length > 0;
      return v;
    }
    function allTasks() {
      var saved = state.saved.map(viewTask);
      var cands = state.candidates.map(function (c) { var v = Object.assign({}, c); v.isCandidate = true; return v; });
      return saved.concat(cands).sort(function (a, b) {
        var pa = a.priority === '' ? Infinity : Number(a.priority), pb = b.priority === '' ? Infinity : Number(b.priority);
        return pa - pb;
      });
    }
    function changedCount() { return Object.keys(state.edits).length; }
    function unconfirmed() { return state.candidates.filter(function (c) { return needsConfirm(c) && c.exceptionConfirmed !== true; }); }

    // ---- 編集 ----
    function setField(task, key, value) {
      if (task.isCandidate) {
        var c = state.candidates.filter(function (x) { return x.key === task.key; })[0];
        c[key] = value;
      } else {
        var orig = state.saved.filter(function (x) { return x.taskId === task.key; })[0];
        var e = state.edits[task.key] || {};
        if (String(orig[key]) === String(value)) delete e[key]; else e[key] = value;
        if (Object.keys(e).length) state.edits[task.key] = e; else delete state.edits[task.key];
      }
      render();
    }
    // 保存済みタスクの削除（IS-06）：確認のうえ、Sheetsの行は残して「削除済み」にし、履歴に「削除」を記録する。
    // 他のタスクの未確定の変更・候補はそのまま残す
    function deleteSaved(t) {
      if (!window.confirm('「' + t.title + '」を削除します。\n週間タスク・朝ブリーフに表示されなくなります（Sheetsの行は残り、履歴に「削除」が記録されます）。')) return;
      var week = state.week, key = t.key, title = t.title;
      App.callServer('deleteTask', [week, key], function (res) {
        // 削除したカードだけを画面から外す（他の未確定の変更・候補はそのまま）
        state.saved = state.saved.filter(function (x) { return x.taskId !== key; });
        delete state.edits[key];
        delete state.openDetails[key]; delete state.openRecords[key]; delete state.openHistory[key];
        if (res && res.loadedAt) showLoaded(res.loadedAt);
        render();
        var s = $('wk-saved');
        s.textContent = '「' + title + '」を削除しました（Sheetsの行は残し、削除済みにしました）。';
        s.hidden = false;
      }, function () {
        // 失敗したときは、画面の下にも知らせ、正データを読み直して実際の状態を表示する
        var s = $('wk-saved');
        s.textContent = '「' + title + '」の削除に失敗しました。画面上部のエラーを確認してください。';
        s.hidden = false;
        if (!hasPending()) load(week);
      });
    }
    function removeCandidate(key) {
      state.candidates = state.candidates.filter(function (c) { return c.key !== key; });
      render();
    }

    // ---- 描画 ----
    function select(values, current, withBlank, label) {
      var s = el('select');
      s.setAttribute('aria-label', label);
      if (withBlank) { var o = el('option', '', '未配置'); o.value = ''; s.appendChild(o); }
      values.forEach(function (v) { var o = el('option', '', v); o.value = v; s.appendChild(o); });
      s.value = current;
      return s;
    }
    // 一覧カードに出す「現在地」：既存の「AI案件現在地」の最初の一文だけ（先頭の「現在工程：」は省く）。
    // 現在地のデータが無いタスクには何も出さない（推測で作らない）。全文は「詳細・編集」で見る
    function shortPosition(text) {
      var s = String(text || '').replace(/^現在工程：/, '');
      var i = s.indexOf('。');
      return i >= 0 ? s.slice(0, i) : s;
    }

    // 一覧カード（IS-06 是正）：一覧ではタスク名・状態・優先度・重点・例外の有無だけを見せ、
    // 編集項目と詳細（現在地・例外の根拠・履歴など）は「詳細・編集」を開いたときに出す
    function card(t, colDay) {
      var c = el('div', 'wk-card' + (t.isCandidate ? ' is-candidate' : '') + (t.changed ? ' is-changed' : ''));
      c.setAttribute('data-key', t.key);
      var top = el('div', 'wk-card-top');
      top.appendChild(el('span', 'wk-tag ' + (t.kind === 'AI案件' ? 'tag-ai' : 'tag-normal'), t.kind));
      if (t.isCandidate) top.appendChild(el('span', 'wk-badge', '候補'));
      else if (t.changed) top.appendChild(el('span', 'wk-badge is-changed', '変更あり'));
      if (t.sourceTaskId) top.appendChild(el('span', 'wk-badge is-carry', t.isCandidate ? '前週から（' + (t.sourceStatus || '持越し') + '）' : '持越し'));
      if (daysOf(t.day).length > 1) top.appendChild(el('span', 'wk-badge is-multi', daysOf(t.day).join('・')));
      // ゴミ箱：候補は既存の候補削除（確定前なので正データは不変）、保存済みは「削除済み」にする（IS-06）
      var del = el('button', 'wk-trash', '🗑');
      del.type = 'button'; del.title = t.isCandidate ? 'この候補を削除' : 'このタスクを削除'; del.setAttribute('aria-label', '削除');
      del.addEventListener('click', function () { if (t.isCandidate) removeCandidate(t.key); else deleteSaved(t); });
      top.appendChild(del);
      c.appendChild(top);

      c.appendChild(el('p', 'wk-card-title', t.title));
      if (t.aiPosition) {
        var pos = el('p', 'wk-card-pos', '現在地：' + shortPosition(t.aiPosition));
        pos.title = t.aiPosition;
        c.appendChild(pos);
      }
      var meta = el('div', 'wk-card-meta');
      meta.appendChild(el('span', 'wk-status-pill st-' + STATUS.indexOf(t.status), t.status));
      meta.appendChild(el('span', 'wk-meta-item', t.priority === '' ? '優先度なし' : '優先' + t.priority));
      if (t.focus === true) meta.appendChild(el('span', 'wk-focus-mark', '★重点'));
      exceptionTypes(t.exception).forEach(function (x) { meta.appendChild(el('span', 'wk-exc-tag', x)); });
      c.appendChild(meta);

      if (t.isCandidate && needsConfirm(t)) {
        var cl = el('label', 'wk-confirm' + (t.exceptionConfirmed ? ' is-done' : ''));
        var cb = el('input'); cb.type = 'checkbox'; cb.checked = t.exceptionConfirmed === true;
        cb.addEventListener('change', function () { setField(t, 'exceptionConfirmed', cb.checked); });
        cl.appendChild(cb);
        cl.appendChild(document.createTextNode(exceptionTypes(t.exception).filter(function (x) { return CONFIRM_REQUIRED.indexOf(x) >= 0; }).join('・') + 'の内容を確認した（根拠は「詳細・編集」で確認。チェックするまで保存できません）'));
        c.appendChild(cl);
      }
      if (!t.isCandidate) c.appendChild(recordEditor(t));
      c.appendChild(detailPanel(t));
      makeDraggable(c, t, colDay);
      return c;
    }

    // 詳細・編集（タスク名・曜日・状態・優先度・重点、AI案件現在地、例外の根拠、申し送り、変更履歴）
    function detailPanel(t) {
      var d = el('details', 'wk-detail');
      d.open = !!state.openDetails[t.key];
      d.addEventListener('toggle', function () { state.openDetails[t.key] = d.open; });
      d.appendChild(el('summary', 'wk-detail-btn', '詳細・編集'));

      var title = el('input', 'wk-title');
      title.type = 'text'; title.value = t.title; title.setAttribute('aria-label', 'タスク名');
      title.addEventListener('change', function () {
        if (!title.value.trim()) { App.showError('タスク名は空にできません。'); title.value = t.title; return; }
        setField(t, 'title', title.value.trim());
      });
      var tl = el('label', 'wk-record-field'); tl.appendChild(el('span', '', 'タスク名')); tl.appendChild(title);
      d.appendChild(tl);

      // 曜日：月〜金を複数選択して追加・解除（PC・スマホ共通）。すべて外すと未配置
      var dayBox = el('div', 'wk-days');
      dayBox.setAttribute('role', 'group');
      dayBox.setAttribute('aria-label', '曜日');
      dayBox.appendChild(el('span', 'wk-days-label', '曜日（複数可）'));
      var cur = daysOf(t.day);
      DAYS.forEach(function (dname) {
        var l = el('label', 'wk-day-check');
        var cb = el('input'); cb.type = 'checkbox'; cb.value = dname; cb.checked = cur.indexOf(dname) >= 0;
        cb.setAttribute('aria-label', '曜日 ' + dname);
        cb.addEventListener('change', function () {
          var next = daysOf(t.day).filter(function (x) { return x !== dname; });
          if (cb.checked) next.push(dname);
          setField(t, 'day', joinDays(next));
        });
        l.appendChild(cb); l.appendChild(document.createTextNode(dname));
        dayBox.appendChild(l);
      });
      d.appendChild(dayBox);

      var row = el('div', 'wk-fields');
      var status = select(STATUS, t.status, false, '状態');
      status.className = 'wk-status';
      status.addEventListener('change', function () { setField(t, 'status', status.value); });
      var pri = el('input', 'wk-priority');
      pri.type = 'number'; pri.min = '1'; pri.step = '1'; pri.value = t.priority; pri.setAttribute('aria-label', '優先度');
      pri.addEventListener('change', function () {
        var v = pri.value === '' ? '' : Number(pri.value);
        if (v !== '' && !(v >= 1 && v % 1 === 0)) { App.showError('優先度は1以上の整数です。'); pri.value = t.priority; return; }
        setField(t, 'priority', v);
      });
      var focusLabel = el('label', 'wk-focus-label');
      var focus = el('input'); focus.type = 'checkbox'; focus.checked = t.focus === true; focus.setAttribute('aria-label', '重点');
      focus.addEventListener('change', function () { setField(t, 'focus', focus.checked); });
      focusLabel.appendChild(focus); focusLabel.appendChild(document.createTextNode('重点'));
      [['状態', status], ['優先度', pri]].forEach(function (p) {
        var l = el('label', 'wk-field'); l.appendChild(el('span', '', p[0])); l.appendChild(p[1]); row.appendChild(l);
      });
      row.appendChild(focusLabel);
      d.appendChild(row);

      if (t.aiPosition) d.appendChild(el('p', 'wk-ai-position', '現在地：' + t.aiPosition));
      if (t.exception) d.appendChild(exceptionBox(t.exception));
      if (t.isCandidate && t.handover) d.appendChild(el('p', 'wk-handover', '前週の申し送り：' + t.handover));
      if (!t.isCandidate) d.appendChild(historyViewer(t));
      return d;
    }

    // 実施結果・メモ・次回申し送り（保存済みタスクのみ）
    function recordEditor(t) {
      var d = el('details', 'wk-record');
      d.open = !!state.openRecords[t.key];
      d.addEventListener('toggle', function () { state.openRecords[t.key] = d.open; });
      var filled = RECORD_FIELDS.filter(function (f) { return t[f[0]]; }).length;
      var sm = el('summary', 'wk-record-btn', '✎ 記録');
      if (filled) sm.appendChild(el('span', 'wk-record-filled', '　' + filled + '件'));
      d.appendChild(sm);
      RECORD_FIELDS.forEach(function (f) {
        var l = el('label', 'wk-record-field');
        l.appendChild(el('span', '', f[1]));
        var ta = el('textarea');
        ta.rows = 2; ta.value = t[f[0]] || ''; ta.setAttribute('aria-label', f[1]);
        ta.addEventListener('change', function () { setField(t, f[0], ta.value); });
        l.appendChild(ta);
        d.appendChild(l);
      });
      // 例外情報：確認して解消したら空欄にする（変更は履歴に残る）
      var el2 = el('label', 'wk-record-field');
      el2.appendChild(el('span', '', '例外情報（解消したら空欄にする。区分：' + EXCEPTIONS.join('／') + '）'));
      var ex = el('textarea');
      ex.rows = 2; ex.value = t.exception || ''; ex.setAttribute('aria-label', '例外情報');
      ex.addEventListener('change', function () {
        var v = ex.value.trim();
        if (!validException(v)) { App.showError('例外情報は空欄、または「区分：内容」で書いてください。区分は ' + EXCEPTIONS.join('／') + ' です。'); ex.value = t.exception || ''; return; }
        setField(t, 'exception', v);
      });
      el2.appendChild(ex);
      d.appendChild(el2);
      return d;
    }

    // 変更履歴（保存済みタスクのみ。開いたときに正データから読む）
    function historyViewer(t) {
      var d = el('details', 'wk-history');
      d.appendChild(el('summary', '', '変更履歴を見る'));
      var box = el('div', 'wk-history-body');
      d.appendChild(box);
      function fill() {
        box.innerHTML = '';
        box.appendChild(el('p', 'wk-muted', '読み込み中…'));
        App.callServer('getTaskHistory', [t.key], function (res) {
          box.innerHTML = '';
          if (!res.history.length) box.appendChild(el('p', 'wk-muted', '履歴はありません。'));
          var ul = el('ul', 'wk-history-list');
          res.history.forEach(function (h) {
            // 手動追加（v1.2）は「作成（手動追加）」と表示する
            var txt = h.op === '作成' && h.field === '手動追加' ? h.at + '　作成（手動追加）' :
              h.at + '　' + h.op + (h.field ? '　' + h.field + '：' + (h.before === '' ? '（空欄）' : h.before) + ' → ' + (h.after === '' ? '（空欄）' : h.after) : '');
            ul.appendChild(el('li', '', txt));
          });
          box.appendChild(ul);
          box.appendChild(el('p', 'wk-muted', res.loadedAt + ' 時点'));
        }, function () {
          box.innerHTML = '';
          box.appendChild(el('p', 'wk-stale', '履歴を読み込めませんでした。閉じて開き直してください。'));
        });
      }
      d.open = !!state.openHistory[t.key];
      if (d.open) fill();
      d.addEventListener('toggle', function () {
        state.openHistory[t.key] = d.open;
        if (d.open) fill();
      });
      return d;
    }

    // ---- ドラッグ＆ドロップで曜日を変える（PC）----
    // 落とした時点では曜日の変更を「未確定の変更」に加えるだけ。保存は「確定して保存」（既存の流れと同じ）
    function makeDraggable(c, t, colDay) {
      c.draggable = true;
      // 入力欄・ボタンの上では、文字選択や操作を優先してドラッグしない
      c.addEventListener('mousedown', function (e) {
        c.draggable = !e.target.closest('input, textarea, select, button, summary, label');
      });
      c.addEventListener('dragstart', function (e) {
        state.dragKey = t.key;
        state.dragFrom = colDay || '';
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', t.key);
        c.classList.add('is-dragging');
      });
      c.addEventListener('dragend', function () {
        state.dragKey = null;
        c.classList.remove('is-dragging');
        var cols = document.querySelectorAll('.wk-col.is-drop');
        for (var i = 0; i < cols.length; i++) cols[i].classList.remove('is-drop');
      });
    }
    function makeDropTarget(col, day) {
      col.addEventListener('dragover', function (e) {
        if (!state.dragKey) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        col.classList.add('is-drop');
      });
      col.addEventListener('dragleave', function (e) {
        if (!col.contains(e.relatedTarget)) col.classList.remove('is-drop');
      });
      col.addEventListener('drop', function (e) {
        e.preventDefault();
        col.classList.remove('is-drop');
        var key = state.dragKey || e.dataTransfer.getData('text/plain');
        var from = state.dragFrom || '';
        state.dragKey = null; state.dragFrom = '';
        var t = allTasks().filter(function (x) { return x.key === key; })[0];
        if (!t || from === day) return;
        // 曜日の「移動」：つかんだ段の曜日を外し、落とした段の曜日を加える（他の曜日はそのまま）。未配置へ落とすと、つかんだ曜日だけを外す
        var next = daysOf(t.day).filter(function (x) { return x !== from; });
        if (day) next.push(day);
        var v = joinDays(next);
        if (v !== (t.day || '')) setField(t, 'day', v);
      });
    }

    function render() {
      $('wk-week').textContent = state.week + '（月）〜' + addDays(state.week, 4) + '（金）';
      var tasks = allTasks();

      // 今週の要点・コーション
      if (state.analysis) {
        $('wk-outlook').textContent = state.analysis.outlook;
        $('wk-outlook').className = '';
        var ul = $('wk-cautions'); ul.innerHTML = '';
        state.analysis.cautions.forEach(function (c) { ul.appendChild(el('li', '', String(c))); });
        if (!state.analysis.cautions.length) ul.appendChild(el('li', 'wk-muted', 'なし'));
      }

      // 重点
      var focused = tasks.filter(function (t) { return t.focus === true; });
      $('wk-focus-count').textContent = focused.length;
      var ol = $('wk-focus'); ol.innerHTML = '';
      focused.forEach(function (t) { ol.appendChild(el('li', '', t.title + (t.isCandidate ? '（候補）' : ''))); });
      var note = $('wk-focus-note');
      note.hidden = focused.length >= 3 && focused.length <= 5;
      note.textContent = '重点は3〜5件が目安です（現在' + focused.length + '件）。';

      // 曜日別ボード
      var board = $('wk-board'); board.innerHTML = '';
      DAYS.concat(['']).forEach(function (d) {
        var col = el('section', 'wk-col');
        col.setAttribute('data-day', d || '未配置');
        var items = tasks.filter(function (t) { return d ? daysOf(t.day).indexOf(d) >= 0 : !daysOf(t.day).length; });
        col.appendChild(el('h4', 'wk-col-title', (d || '未配置') + '（' + items.length + '）'));
        var list = el('div', 'wk-col-cards');
        items.forEach(function (t) { list.appendChild(card(t, d)); });
        if (!items.length) list.appendChild(el('p', 'wk-muted wk-col-empty', d ? 'なし（ここへドラッグして配置）' : 'なし'));
        col.appendChild(list);
        makeDropTarget(col, d);
        board.appendChild(col);
      });

      // 確定欄
      var n = state.candidates.length, m = changedCount();
      var waiting = unconfirmed().length;
      $('wk-pending').textContent = ((n || m) ? '未確定の変更：候補 ' + n + '件・変更 ' + m + '件' : '未確定の変更はありません') +
        (waiting ? '。確認待ちの候補が ' + waiting + '件あります（カードのチェックを入れてください）' : '');
      $('wk-commit').disabled = !(n || m) || waiting > 0;
    }

    // ---- サーバー連携 ----
    // 読込時点の表示（IS-05）。読込に失敗したときは、表示中が前回値であることと時点を示す
    function showLoaded(at) {
      state.loadedAt = at;
      $('wk-loaded-at').textContent = '正データ ' + at + ' 時点';
      $('wk-stale').hidden = true;
    }
    function load(week) {
      var sameWeek = week === state.week && !!state.loadedAt;
      $('wk-loading').hidden = false;
      if (!sameWeek) $('wk-board').hidden = true;
      $('wk-saved').hidden = true;
      App.callServer('getWeekBoard', [week], function (res) {
        state.week = res.targetWeek;
        state.saved = res.tasks;
        state.edits = {};
        $('wk-loading').hidden = true;
        $('wk-board').hidden = false;
        showLoaded(res.loadedAt);
        render();
      }, function () {
        $('wk-loading').hidden = true;
        var st = $('wk-stale');
        st.hidden = false;
        if (sameWeek) {
          // 前回値を残す場合は「前回値」「時点」を明示する
          st.textContent = '最新の読み込みに失敗しました。表示中は ' + state.loadedAt + ' 時点の前回値です。「再読込」を押して取り直してください。';
        } else {
          // 別の週の前回値は表示しない
          $('wk-board').hidden = true;
          state.week = week; state.saved = []; state.loadedAt = '';
          $('wk-week').textContent = week + '（月）〜' + addDays(week, 4) + '（金）';
          $('wk-loaded-at').textContent = '';
          st.textContent = 'この週の正データを読み込めませんでした。「再読込」を押して取り直してください。';
        }
      });
    }
    function hasPending() { return state.candidates.length > 0 || changedCount() > 0; }
    function moveWeek(n) {
      if (hasPending() && !window.confirm('未確定の変更があります。破棄して移動しますか？')) return;
      state.candidates = [];
      showExcluded([]);
      if (n !== 0) {
        // 週を移動したら分析結果の表示も消す（再読込では残す）
        state.analysis = null;
        $('wk-outlook').textContent = 'ChatGPT Project の分析結果は未読込です。';
        $('wk-outlook').className = 'wk-muted';
        $('wk-cautions').innerHTML = '<li class="wk-muted">未読込</li>';
      }
      load(addDays(state.week, n));
    }
    function commit() {
      var creates = state.candidates.map(function (c) {
        return { title: c.title, kind: c.kind, day: c.day, priority: c.priority, focus: c.focus, status: c.status, exception: c.exception, aiPosition: c.aiPosition, handover: c.handover || '', sourceTaskId: c.sourceTaskId || '', exceptionConfirmed: c.exceptionConfirmed === true };
      });
      var updates = Object.keys(state.edits).map(function (id) {
        var ch = {};
        EDIT_KEYS.forEach(function (k) { if (state.edits[id].hasOwnProperty(k)) ch[k] = state.edits[id][k]; });
        return { taskId: id, changes: ch };
      });
      var msg = '次の内容で確定し、保存します。\n候補の採用：' + creates.length + '件\n既存タスクの変更：' + updates.length + '件';
      if (!window.confirm(msg)) return;
      $('wk-commit').disabled = true;
      App.callServer('commitWeekBoard', [state.week, { creates: creates, updates: updates }], function (res) {
        state.saved = res.tasks;
        state.edits = {};
        state.candidates = [];
        showLoaded(res.loadedAt);
        render();
        var s = $('wk-saved');
        s.textContent = '保存しました（追加 ' + res.created + '件・変更 ' + res.updated + '件）。正データを再読込して表示しています。';
        s.hidden = false;
      }, function () { render(); });
    }

    $('wk-prev').addEventListener('click', function () { moveWeek(-7); });
    $('wk-next').addEventListener('click', function () { moveWeek(7); });
    $('wk-reload').addEventListener('click', function () { moveWeek(0); });
    $('wk-commit').addEventListener('click', commit);
    $('wk-import-load').addEventListener('click', function () {
      try { importAnalysis(); App.clearError(); } catch (e) { App.showError(e.message); }
    });
    window.addEventListener('beforeunload', function (e) { if (hasPending()) { e.preventDefault(); e.returnValue = ''; } });

    // 前週の「次週候補」「持越し」を候補として取り込む（保存は「確定して保存」）
    function importCarry() {
      App.callServer('getCarryCandidates', [state.week], function (res) {
        var titles = state.candidates.map(function (c) { return c.title; });
        var added = 0, skipped = res.excluded.slice();
        res.candidates.forEach(function (c) {
          if (titles.indexOf(c.title) >= 0) { skipped.push(c.title); return; }
          c.key = 'c' + (++state.seq);
          state.candidates.push(c);
          added++;
        });
        var p = $('wk-import-excluded');
        p.hidden = false;
        p.textContent = '前週（' + res.fromWeek + '）の次週候補・持越しから候補に追加：' + added + '件' +
          (skipped.length ? '。取り込み済み・同名のため除外：' + skipped.length + '件（' + skipped.join('、') + '）' : '');
        render();
      });
    }

    // ---- 手動タスク追加（追加実装 v1.2）：AI／Workで拾えないタスクを確定タスクとして直接追加する ----
    function buildAddDays() {
      var box = $('wk-add-days');
      DAYS.forEach(function (dname) {
        var l = el('label', 'wk-day-check');
        var cb = el('input'); cb.type = 'checkbox'; cb.value = dname; cb.setAttribute('aria-label', '追加 曜日 ' + dname);
        l.appendChild(cb); l.appendChild(document.createTextNode(dname));
        box.appendChild(l);
      });
      var kind = $('wk-add-kind');
      KINDS.forEach(function (k) { var o = el('option', '', k); o.value = k; kind.appendChild(o); });
      kind.addEventListener('change', syncAddKind);
    }
    // AI案件現在地は、種別がAI案件のときだけ入力できる
    function syncAddKind() {
      var ai = $('wk-add-kind').value === 'AI案件';
      $('wk-add-ai-field').hidden = !ai;
      if (!ai) $('wk-add-ai').value = '';
    }
    function resetAdd() {
      $('wk-add-title').value = '';
      $('wk-add-kind').value = KINDS[0];
      var cbs = $('wk-add-days').querySelectorAll('input');
      for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
      $('wk-add-priority').value = '';
      $('wk-add-focus').checked = false;
      $('wk-add-memo').value = '';
      $('wk-add-ai').value = '';
      syncAddKind();
    }
    function openAdd() {
      if (!$('wk-add').hidden) { $('wk-add-title').focus(); return; }
      resetAdd();
      $('wk-add').hidden = false;
      $('wk-add-title').focus();
    }
    function closeAdd() { $('wk-add').hidden = true; }
    function addManual() {
      var title = $('wk-add-title').value.trim();
      if (!title) { App.showError('タスク名を入力してください。'); return; }
      // 画面上の保存済み・未確定の候補と同名なら追加しない（既存ルール：対象週の同名は不可）
      var titles = allTasks().map(function (t) { return String(t.title); });
      if (titles.indexOf(title) >= 0) { App.showError('この週に同名のタスク（候補を含む）があるため追加できません：' + title); return; }
      var pv = $('wk-add-priority').value;
      if (pv !== '' && !(Number(pv) >= 1 && Number(pv) % 1 === 0)) { App.showError('優先度は1以上の整数です。'); return; }
      var days = [];
      var cbs = $('wk-add-days').querySelectorAll('input');
      for (var i = 0; i < cbs.length; i++) if (cbs[i].checked) days.push(cbs[i].value);
      var kind = $('wk-add-kind').value;
      var input = {
        title: title, kind: kind, day: joinDays(days), priority: pv === '' ? '' : Number(pv),
        focus: $('wk-add-focus').checked, memo: $('wk-add-memo').value,
        aiPosition: kind === 'AI案件' ? $('wk-add-ai').value.trim() : ''
      };
      var week = state.week;
      $('wk-add-save').disabled = true;
      App.callServer('addManualTask', [week, input], function (res) {
        $('wk-add-save').disabled = false;
        // 追加したタスクだけを画面へ加える（他の未確定の変更・候補はそのまま）
        if (res.targetWeek === state.week && res.task) state.saved.push(res.task);
        closeAdd();
        render();
        var s = $('wk-saved');
        s.textContent = '「' + title + '」を追加しました（確定タスクとして保存しました）。';
        s.hidden = false;
      }, function () { $('wk-add-save').disabled = false; });
    }
    buildAddDays();
    $('wk-add-open').addEventListener('click', openAdd);
    $('wk-add-cancel').addEventListener('click', closeAdd);
    $('wk-add-save').addEventListener('click', addManual);

    window.Weekly = { parse: parseHandoff, state: state };
    $('wk-carry').addEventListener('click', importCarry);
    // 週間画面を表示したとき、未確定の変更がなければ正データを読み直す（朝ブリーフ画面での更新を反映）
    document.addEventListener('viewshown', function (e) {
      if (e.detail === 'weekly' && !hasPending()) load(state.week);
    });
    load(state.week);
  })();
</script>
