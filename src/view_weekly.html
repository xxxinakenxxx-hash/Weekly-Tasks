<div class="wk-head">
  <h2 class="view-title">週間タスク</h2>
  <div class="wk-nav">
    <button type="button" id="wk-prev" class="btn">◀ 前週</button>
    <span id="wk-week" class="wk-week"></span>
    <button type="button" id="wk-next" class="btn">次週 ▶</button>
    <button type="button" id="wk-reload" class="btn">再読込</button>
    <button type="button" id="wk-carry" class="btn">前週の次週候補・持越しを取り込む</button>
  </div>
</div>

<section class="wk-panel" aria-labelledby="wk-outlook-title">
  <h3 id="wk-outlook-title">今週の要点</h3>
  <p id="wk-outlook" class="wk-muted">ChatGPT Project の分析結果は未読込です。</p>
  <h3>注意・コーション</h3>
  <ul id="wk-cautions"><li class="wk-muted">未読込</li></ul>
</section>

<section class="wk-panel" aria-labelledby="wk-focus-title">
  <h3 id="wk-focus-title">今週の重点（<span id="wk-focus-count">0</span>件）</h3>
  <p id="wk-focus-note" class="wk-note" hidden></p>
  <ol id="wk-focus"></ol>
</section>

<details class="wk-panel" id="wk-import">
  <summary>ChatGPT Project の分析結果を読み込む</summary>
  <textarea id="wk-import-input" class="wk-import-input" rows="6" placeholder="ChatGPT Projectが出力したJSONを貼り付けてください"></textarea>
  <button type="button" id="wk-import-load" class="btn btn-primary">読み込む</button>
  <p class="wk-muted">読み込んだタスク案は「候補」として下のボードに表示されます。確定するまで保存されません。</p>
</details>
<p id="wk-import-excluded" class="wk-note wk-excluded" role="status" hidden></p>

<p id="wk-stale" class="wk-stale" role="alert" hidden></p>
<p id="wk-loaded-at" class="wk-muted wk-loaded-at"></p>
<p id="wk-loading" class="wk-muted">読み込み中…</p>
<p class="wk-muted wk-dnd-note">カードをつかんで曜日の段へ落とすと、曜日を変えられます（「確定して保存」で保存）。スマホは「詳細・編集」の曜日で変えます。</p>
<div id="wk-board" class="wk-board" hidden></div>

<div class="wk-commit">
  <span id="wk-pending" class="wk-pending">未確定の変更はありません</span>
  <button type="button" id="wk-commit" class="btn btn-primary" disabled>確定して保存</button>
</div>
<p id="wk-saved" class="wk-saved" role="status" hidden></p>
