<style>
  :root {
    --bg: #f7f7f5;
    --fg: #222;
    --muted: #666;
    --accent: #2f6fb3;
    --border: #d9d9d4;
    --error-bg: #fdecea;
    --error-fg: #a12622;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  .app-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .app-title { margin: 0; font-size: 18px; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 8px 16px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--fg);
    cursor: pointer;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 16px; }
  .view-title { margin: 0 0 12px; font-size: 20px; }
  .placeholder { color: var(--muted); }
  .error-box {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin: 12px 16px 0;
    padding: 10px 12px;
    background: var(--error-bg);
    color: var(--error-fg);
    border: 1px solid var(--error-fg);
    border-radius: 6px;
  }
  .error-box[hidden] { display: none; }
  .error-close { border: none; background: none; color: inherit; font-size: 18px; cursor: pointer; }
  .btn { padding: 6px 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--fg); cursor: pointer; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-small { padding: 4px 10px; font-size: 13px; margin-top: 6px; }
  .wk-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .wk-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .wk-week { font-weight: bold; }
  .wk-panel { margin-top: 12px; padding: 12px; background: #fff; border: 1px solid var(--border); border-radius: 6px; }
  .wk-panel h3 { margin: 0 0 6px; font-size: 15px; }
  .wk-panel ul, .wk-panel ol { margin: 0 0 8px; padding-left: 20px; }
  .wk-panel summary { cursor: pointer; font-weight: bold; }
  .wk-muted { color: var(--muted); }
  .wk-note { color: #8a5a00; font-size: 13px; margin: 0 0 6px; }
  .wk-excluded { margin: 8px 0 0; padding: 8px 12px; background: #fff8e6; border: 1px solid #e6c47a; border-radius: 6px; overflow-wrap: anywhere; }
  .wk-import-input { width: 100%; margin-top: 8px; font-family: monospace; font-size: 13px; }
  /* 週間ボード（IS-06 是正）：曜日ごとに横長の段を縦に並べ、段の中はカードを幅に応じて並べる */
  .wk-board { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .wk-col { background: #eeeeea; border-radius: 6px; padding: 8px; min-width: 0; }
  .wk-col-title { margin: 0 0 6px; font-size: 15px; }
  .wk-col-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; align-items: start; }
  .wk-col-empty { margin: 0; font-size: 13px; }
  .wk-card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 10px; min-width: 0; }
  .wk-card-title { margin: 2px 0 6px; font-size: 15px; font-weight: bold; overflow-wrap: anywhere; }
  .wk-card-pos { margin: 0 0 6px; font-size: 12px; color: #5a2a8a; line-height: 1.4; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .wk-trash { margin-left: auto; padding: 0 4px; border: none; background: none; font-size: 14px; line-height: 1; cursor: pointer; opacity: .55; }
  .wk-trash:hover { opacity: 1; }
  .wk-card[draggable="true"] { cursor: grab; }
  .wk-card.is-dragging { opacity: .4; }
  .wk-col.is-drop { outline: 3px dashed var(--accent); outline-offset: -3px; background: #e3eefb; }
  .wk-col { min-height: 64px; }
  .wk-dnd-note { margin: 8px 0 0; font-size: 12px; }
  .wk-card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
  .wk-status-pill { padding: 2px 8px; border-radius: 10px; background: #eeeeea; font-weight: bold; white-space: nowrap; }
  .wk-status-pill.st-1 { background: #e3eefb; color: #1f4f86; }
  .wk-status-pill.st-2 { background: #e8f2e8; color: #2d6a2d; }
  .wk-status-pill.st-3, .wk-status-pill.st-4 { background: #fff1d6; color: #8a5a00; }
  .wk-meta-item { color: var(--muted); white-space: nowrap; }
  .wk-focus-mark { color: #b06d00; font-weight: bold; white-space: nowrap; }
  .wk-detail { margin-top: 4px; font-size: 13px; }
  .wk-detail-btn { display: inline-block; cursor: pointer; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; color: var(--fg); list-style: none; font-size: 13px; }
  .wk-detail-btn::-webkit-details-marker { display: none; }
  .wk-detail-btn::before { content: "▸ "; }
  .wk-detail[open] > .wk-detail-btn::before { content: "▾ "; }
  .wk-detail[open] > .wk-detail-btn { background: #eeeeea; }
  .wk-card.is-candidate { border-style: dashed; border-color: var(--accent); }
  .wk-card.is-changed { border-color: #c98a00; }
  .wk-card-top { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .wk-tag, .wk-badge { font-size: 11px; padding: 1px 6px; border-radius: 10px; }
  .tag-normal { background: #e3eefb; color: #1f4f86; }
  .tag-ai { background: #efe4fb; color: #5a2a8a; }
  .wk-badge { background: #e8f2e8; color: #2d6a2d; }
  .wk-badge.is-changed { background: #fff1d6; color: #8a5a00; }
  .wk-title { width: 100%; font-size: 14px; padding: 4px; border: 1px solid var(--border); border-radius: 4px; }
  .wk-fields { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12px; }
  .wk-field { display: flex; flex-direction: column; }
  .wk-field select, .wk-priority { font-size: 13px; }
  .wk-priority { width: 4em; }
  .wk-focus-label { display: flex; align-items: center; gap: 2px; align-self: flex-end; }
  .wk-badge.is-carry { background: #e6eefb; color: #1f4f86; }
  .wk-record { margin-top: 6px; font-size: 12px; }
  /* 実施結果・メモ・申し送り：塗りつぶしの操作ボタン */
  .wk-record-btn { display: block; cursor: pointer; margin-top: 6px; padding: 6px 10px; font-size: 14px; font-weight: bold; text-align: center;
    border: 1px solid var(--accent); border-radius: 6px; color: #fff; background: var(--accent); list-style: none; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .wk-record-btn::-webkit-details-marker { display: none; }
  .wk-record[open] .wk-record-btn { background: #1f4f86; }
  .wk-record-filled { font-weight: normal; }
  .wk-record-field { display: flex; flex-direction: column; margin-top: 4px; }
  .wk-record-field textarea { width: 100%; font-size: 13px; }
  .wk-handover { margin: 6px 0 0; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .wk-ai-position { margin: 6px 0 0; font-size: 12px; color: #5a2a8a; white-space: pre-wrap; overflow-wrap: anywhere; }
  .wk-exception { margin: 6px 0 0; font-size: 12px; color: var(--error-fg); overflow-wrap: anywhere; }
  .wk-exc-line { margin: 2px 0 0; }
  .wk-exc-tag { display: inline-block; margin-right: 4px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: bold;
    background: var(--error-fg); color: #fff; white-space: nowrap; }
  .br-exc { color: var(--error-fg); }
  .wk-confirm { display: block; margin-top: 6px; padding: 6px; font-size: 12px; border: 2px solid var(--error-fg); border-radius: 6px; background: #fff5f5; }
  .wk-confirm.is-done { border-color: var(--border); background: #fff; }
  .wk-history { margin-top: 6px; font-size: 12px; }
  .wk-history > summary { cursor: pointer; color: var(--muted); }
  .wk-history-list { margin: 4px 0; padding-left: 16px; overflow-wrap: anywhere; }
  .wk-stale { margin: 8px 0; padding: 8px 10px; border: 2px solid var(--error-fg); border-radius: 6px; background: #fff5f5; color: var(--error-fg); font-weight: bold; }
  .wk-loaded-at { margin: 4px 0; font-size: 12px; }
  .wk-commit { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
    margin-top: 12px; padding: 10px 12px; background: #fff; border: 1px solid var(--border); border-radius: 6px; }
  .br-one-line p { margin: 0; font-size: 16px; white-space: pre-wrap; }
  /* 朝ブリーフ上段（IS-06 是正） */
  .br-saved-at { margin-top: 6px !important; font-size: 12px !important; }
  .br-top-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
  .br-todo { border-left: 4px solid var(--accent); }
  .br-alert { border-left: 4px solid var(--error-fg); }
  .br-alert li, .br-todo li, #br-flow li { margin-bottom: 4px; overflow-wrap: anywhere; }
  .br-head { font-weight: bold; }
  .br-note { margin-left: 6px; font-size: 13px; color: var(--muted); }
  .br-fold > summary { cursor: pointer; list-style: none; }
  .br-fold > summary::-webkit-details-marker { display: none; }
  .br-fold > summary::after { content: " ▸詳しく"; font-size: 11px; color: var(--accent); white-space: nowrap; }
  .br-fold[open] > summary::after { content: " ▾閉じる"; }
  .br-fold-body { margin: 4px 0 6px; font-size: 13px; color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .br-more > summary { cursor: pointer; font-weight: bold; margin: 4px 0; }
  .br-more ul { margin-top: 6px; }
  #br-concerns-more li, #br-carryover li, #br-done li { font-size: 13px; margin-bottom: 3px; overflow-wrap: anywhere; }
  .br-group-title { margin: 8px 0 6px; font-size: 14px; }
  .br-task { border-bottom: 1px solid var(--border); }
  .br-task-line { display: flex; align-items: center; gap: 8px; padding: 10px 4px; cursor: pointer; }
  .br-task-title { flex: 1; font-weight: bold; overflow-wrap: anywhere; }
  .br-task-status { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: #eeeeea; white-space: nowrap; }
  .br-task-body { padding: 4px 4px 12px; }
  .br-task-foot { display: flex; align-items: center; gap: 8px; }
  #br-tasks-other-wrap summary { cursor: pointer; margin: 8px 0; }
  .wk-saved { color: #2d6a2d; }
  @media (max-width: 600px) {
    .app-header { padding: 10px 12px; }
    .tabs { width: 100%; }
    .tab { flex: 1; }
    main { padding: 12px; }
    .wk-col-cards { grid-template-columns: 1fr; }
    .br-top-grid { grid-template-columns: 1fr; }
  }
</style>
