<style>
  :root {
    --bg: #f7f7f5;
    --fg: #222;
    --muted: #666;
    --accent: #2f6fb3;
    --border: #d9d9d4;
    --error-bg: #fdecea;
    --error-fg: #a12622;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  .app-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid var(--border);
  }
  .app-title { margin: 0; font-size: 18px; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 8px 16px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--fg);
    cursor: pointer;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 16px; }
  .view-title { margin: 0 0 12px; font-size: 20px; }
  .placeholder { color: var(--muted); }
  .error-box {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin: 12px 16px 0;
    padding: 10px 12px;
    background: var(--error-bg);
    color: var(--error-fg);
    border: 1px solid var(--error-fg);
    border-radius: 6px;
  }
  .error-box[hidden] { display: none; }
  .error-close { border: none; background: none; color: inherit; font-size: 18px; cursor: pointer; }
  .handoff { margin-top: 24px; padding: 12px; background: #fff; border: 1px solid var(--border); border-radius: 6px; }
  .handoff-title { margin: 0 0 8px; font-size: 16px; }
  .handoff-input { width: 100%; font-family: monospace; font-size: 13px; }
  .handoff-load { margin-top: 8px; padding: 8px 16px; font-size: 15px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  .handoff-note { color: var(--muted); font-size: 13px; }
  .handoff-meta dt { font-weight: bold; margin-top: 8px; }
  .handoff-meta dd { margin: 4px 0 0; white-space: pre-wrap; }
  .handoff-tasks li, .handoff-result li { margin: 4px 0; overflow-wrap: anywhere; }
  @media (max-width: 600px) {
    .app-header { padding: 10px 12px; }
    .tabs { width: 100%; }
    .tab { flex: 1; }
    main { padding: 12px; }
  }
</style>
