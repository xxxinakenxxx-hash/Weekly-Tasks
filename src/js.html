<script>
  (function () {
    // タブ移動
    function showView(key) {
      var views = document.querySelectorAll('.view');
      var found = false;
      for (var i = 0; i < views.length; i++) {
        var on = views[i].getAttribute('data-view') === key;
        views[i].hidden = !on;
        if (on) found = true;
      }
      if (!found) {
        showError('画面が見つかりません：' + key);
        return;
      }
      var tabs = document.querySelectorAll('.tab');
      for (var j = 0; j < tabs.length; j++) {
        var active = tabs[j].getAttribute('data-view') === key;
        tabs[j].classList.toggle('active', active);
        tabs[j].setAttribute('aria-selected', active ? 'true' : 'false');
      }
      // 画面切替を各画面へ知らせる（表示時に正データを読み直すため）
      document.dispatchEvent(new CustomEvent('viewshown', { detail: key }));
    }

    // エラー表示
    function showError(message) {
      document.getElementById('error-message').textContent = message;
      document.getElementById('error-box').hidden = false;
    }
    function clearError() {
      document.getElementById('error-box').hidden = true;
    }

    // google.script.run の共通呼び出し（失敗時はエラー枠へ表示）
    function callServer(fnName, args, onSuccess, onFailure) {
      google.script.run
        .withSuccessHandler(function (res) { clearError(); if (onSuccess) onSuccess(res); })
        .withFailureHandler(function (err) {
          showError((err && err.message) || String(err));
          if (onFailure) onFailure(err);
        })[fnName].apply(null, args || []);
    }

    // AI案件の現在地の状態（追加改修③）：確認済みの現在地と、まだ確認されていない最新の取得を区別する（週間・朝ブリーフ共通）
    function shortPos(text) {
      var s = String(text || '').replace(/^現在工程：/, '');
      var i = s.indexOf('。');
      return i >= 0 ? s.slice(0, i) : s;
    }
    function mmdd(at) {
      var m = String(at || '').match(/^\d{4}-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/);
      return m ? m[1] + '/' + m[2] + (m[3] ? ' ' + m[3] : '') : String(at || '');
    }
    function aiState(t) {
      var confirmedAt = String(t.aiConfirmedAt || ''), latestAt = String(t.aiLatestAt || ''), result = String(t.aiLatestResult || '');
      var out = {
        position: String(t.aiPosition || ''),
        confirmed: !!confirmedAt,
        stateText: confirmedAt ? '確認済み ' + mmdd(confirmedAt) : '日次で未確認',
        latest: null
      };
      // 確認済みより新しい、確認済みでない取得があれば「最新取得（未確認）」として別に出す
      if (latestAt && result && result.indexOf('確認済み') !== 0 && (!confirmedAt || latestAt > confirmedAt)) {
        var i = result.indexOf('：');
        out.latest = { at: latestAt, when: mmdd(latestAt), type: i >= 0 ? result.slice(0, i) : result, note: i >= 0 ? result.slice(i + 1) : '', position: String(t.aiLatestPosition || '') };
      }
      return out;
    }

    window.App = { showView: showView, showError: showError, clearError: clearError, callServer: callServer, aiState: aiState, shortPos: shortPos };

    window.addEventListener('error', function (e) { showError(e.message); });
    document.getElementById('error-close').addEventListener('click', clearError);
    var tabs = document.querySelectorAll('.tab');
    for (var k = 0; k < tabs.length; k++) {
      tabs[k].addEventListener('click', function () { showView(this.getAttribute('data-view')); });
    }
    showView(APP_CTX.initialView);
  })();
</script>
